name: ParkEase CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch code from GitHub repository
    - name: Checkout Code from GitHub
      uses: actions/checkout@v3

    # 2. Set up Python environment
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    # 3. Install dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install unittest-xml-reporting pytest

    # 4. Perform automated testing
    - name: Run Automated Unit Tests
      run: |
        python -m unittest test_app.py

    # 5. Build Docker Image & Verify Multi-Service Stack (Docker Compose)
    - name: Build and Test Docker Compose Stack
      run: |
        docker compose build
        docker compose up -d
        sleep 5
        docker compose ps
        docker compose down

    # 6. Report Status
    - name: Report Build Status
      if: always()
      run: |
        echo "CI Pipeline Execution Completed Successfully!"